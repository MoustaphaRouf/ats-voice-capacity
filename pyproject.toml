[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atsvc"
version = "1.0.0"
description = "ATS sector capacity from controller radio recordings (Audio-DORATASK x Radio-Traffic)"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Moustapha Amadou Roufaï"}]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "scikit-learn>=1.3", "matplotlib>=3.7"]

[project.optional-dependencies]
audio = ["librosa>=0.10", "soundfile>=0.12"]
excel = ["openpyxl>=3.1", "xlrd>=2.0"]
dev = ["pytest>=7", "nbformat", "nbconvert", "ipykernel"]

[project.scripts]
atsvc = "atsvc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
